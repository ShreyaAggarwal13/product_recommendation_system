{% extends "base.html" %}
{% block title %}Products - ShopSmart{% endblock %}
{% block content %}
<h1 class="page-title">Browse Products</h1>
<div class="products-layout">
  <aside class="filters">
    <h3>Filters</h3>
    <label>Category</label>
    <select id="filter-category"><option value="">All</option></select>

    <label>Brand</label>
    <select id="filter-brand"><option value="">All</option></select>

    <label>Min Price</label>
    <input type="number" id="filter-min" placeholder="0">

    <label>Max Price</label>
    <input type="number" id="filter-max" placeholder="10000">

    <button id="apply-filters" class="btn btn-primary full-width">Apply Filters</button>
    <button id="clear-filters" class="btn btn-outline full-width">Clear</button>
  </aside>
  <section class="products-section">
    <p id="results-count" class="results-count"></p>
    <div id="product-grid" class="product-grid"></div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/app.js"></script>
<script src="/static/js/products.js"></script>
{% endblock %}
